<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>easy-switch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><img src="assets/icon.png" alt="" width="54" height="54"><div><h1>easy-switch</h1><p data-i18n="tagline">Keep every conversation flowing.</p></div></div>
    <div class="appearance-controls">
      <div class="icon-control"><button id="language-button" class="icon-button" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="language"><svg aria-hidden="true"><use href="assets/ui.svg#globe"/></svg></button><div id="language-menu" class="control-popover" role="menu" hidden><button role="menuitemradio" data-language="en">English</button><button role="menuitemradio" data-language="zh-CN">简体中文</button></div></div>
      <div class="icon-control"><button id="theme-button" class="icon-button" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="appearance"><svg aria-hidden="true"><use id="theme-symbol" href="assets/ui.svg#monitor"/></svg></button><div id="theme-menu" class="control-popover" role="menu" hidden><button role="menuitemradio" data-theme="system" data-i18n="systemTheme">System</button><button role="menuitemradio" data-theme="light" data-i18n="lightTheme">Light</button><button role="menuitemradio" data-theme="dark" data-i18n="darkTheme">Dark</button></div></div>
    </div>
  </header>
  <main>
    <div class="client-picker" role="group" aria-label="Client"><button class="secondary" data-client="codex" aria-pressed="true">Codex</button><button class="secondary" data-client="claude" aria-pressed="false">Claude</button><span class="help" data-i18n="clientHelp"></span></div>
    <div id="tray-hint" class="notice" data-i18n="trayHidden" hidden></div>
    <div id="preferences-warning" class="notice" role="status" hidden></div>
    <div id="error" class="notice error" role="alert" hidden></div>
    <section class="summary glass"><div><span class="eyebrow" data-i18n="currentProvider">CURRENT PROVIDER</span><strong id="current-provider">—</strong></div><div class="route-controls"><span id="status" class="badge" role="status">Starting…</span><button id="routing-toggle" class="secondary">Stop routing</button></div></section>
    <section id="providers" class="panel glass">
      <div class="section-heading"><div><h2 data-i18n="yourProviders">Your providers</h2><p data-i18n="priorityHelp"></p></div><div class="provider-actions"><button id="add-subscription" class="secondary"><svg aria-hidden="true"><use href="assets/ui.svg#plus"/></svg><span data-i18n="addSubscription">Add subscription</span></button><button id="add-api" class="secondary"><svg aria-hidden="true"><use href="assets/ui.svg#plus"/></svg><span data-i18n="addAPI">Add API provider</span></button></div></div>
      <button id="import-existing" class="secondary import-action"><span class="import-icon"><svg aria-hidden="true"><use href="assets/ui.svg#download"/></svg></span><span class="import-copy"><strong data-i18n="importExisting">Import existing sign-in</strong><small data-i18n="importHint">Use the Codex account saved on this computer</small></span><svg aria-hidden="true"><use href="assets/ui.svg#chevron"/></svg></button>
      <div id="provider-list"></div>
      <p id="native-images" class="notice" data-i18n="nativeImagesHelp" hidden></p>
      <p id="claude-desktop-hint" class="notice" data-i18n="claudeDesktopHelp" hidden></p>
      <div id="empty" class="empty" hidden><img src="assets/icon.png" width="68" height="68" alt=""><p data-i18n="empty">Add your first account or API.</p></div>
      <div id="failover" class="notice" hidden></div>
    </section>
    <div class="footnote" data-i18n="lifetime"></div>
  </main>
  <footer><label class="checkbox"><input type="checkbox" id="autostart"><span data-i18n="autoStart">Start at login</span></label><button id="star" class="icon-button" data-i18n-aria="star"><svg aria-hidden="true"><use href="assets/ui.svg#star"/></svg></button><button id="updates" class="link"><svg aria-hidden="true"><use href="assets/ui.svg#refresh"/></svg><span data-i18n="updates">Check for updates</span><span id="update-dot" hidden></span></button><span id="version"></span></footer>
  <dialog id="add-dialog"><form id="provider-form"><div class="section-heading"><h2 id="provider-dialog-title"></h2><button type="button" id="close-dialog" class="icon-button" data-i18n-aria="close"><svg aria-hidden="true"><use href="assets/ui.svg#close"/></svg></button></div><label><span data-i18n="alias">Alias</span><input id="provider-alias" required maxlength="64" data-i18n-placeholder="aliasHint"></label><div id="api-fields" hidden><label><span data-i18n="baseURL">Base URL</span><input id="base-url" data-i18n-placeholder="baseHint"></label><label><span data-i18n="apiKey">API key</span><input id="api-key" type="password" autocomplete="off"></label><p id="edit-key-help" class="help" data-i18n="keepKey" hidden></p><details id="claude-mapping" hidden><summary data-i18n="claudeMapping">Claude model mapping</summary><p class="help" data-i18n="claudeMappingHelp"></p><div class="family-mappings"><label><span>Fable →</span><input id="claude-fable-model" list="claude-model-options" autocomplete="off" data-i18n-placeholder="familyMappingHint"></label><label><span>Opus →</span><input id="claude-opus-model" list="claude-model-options" autocomplete="off" data-i18n-placeholder="familyMappingHint"></label><label><span>Sonnet →</span><input id="claude-sonnet-model" list="claude-model-options" autocomplete="off" data-i18n-placeholder="familyMappingHint"></label><label><span>Haiku →</span><input id="claude-haiku-model" list="claude-model-options" autocomplete="off" data-i18n-placeholder="familyMappingHint"></label></div><datalist id="claude-model-options"></datalist><details><summary data-i18n="legacyMapping">Default and subagent fallback</summary><label><span data-i18n="claudeMainModel">Main model ID</span><input id="claude-main-model" list="claude-model-options" autocomplete="off" data-i18n-placeholder="mappingHint"></label><label><span data-i18n="claudeAgentModel">Subagent model ID</span><input id="claude-agent-model" list="claude-model-options" autocomplete="off" data-i18n-placeholder="agentMappingHint"></label></details><button type="button" id="claude-choose-model" class="secondary" data-i18n="chooseMappingModel" hidden>Choose from provider catalog</button></details></div><p id="account-help" class="help"></p><div id="import-preview" class="notice" hidden></div><div id="login-status" class="notice login-status" hidden><strong id="login-alias"></strong><p id="login-message"></p><div class="login-code"><code id="login-code"></code><button type="button" id="open-login" data-i18n="openLogin">Open official sign-in</button></div><label id="claude-code-field" hidden><span data-i18n="authorizationCode">Authorization code</span><input id="authorization-code" autocomplete="off"></label></div><p id="dialog-error" class="notice error" role="alert" hidden></p><div class="actions"><button type="submit" id="save-provider"></button></div></form></dialog>
  <dialog id="models-dialog" aria-labelledby="models-title">
    <div class="section-heading"><div><span id="models-provider" class="eyebrow"></span><h2 id="models-title" data-i18n="availableModels">Available models</h2></div><button id="close-models" class="icon-button" data-i18n-aria="close"><svg aria-hidden="true"><use href="assets/ui.svg#close"/></svg></button></div>
    <p id="models-status" class="catalog-status" role="status" aria-live="polite"></p>
    <div class="catalog-toolbar"><span id="models-mode" class="help"></span><button id="models-reset" class="link" data-i18n="resetModels">Use automatic catalog</button><button id="models-refresh" class="secondary"><svg aria-hidden="true"><use href="assets/ui.svg#refresh"/></svg><span data-i18n="fetchModels">Fetch available models</span></button></div>
    <input id="models-search" type="search" data-i18n-placeholder="searchModels" data-i18n-aria="searchModels">
    <div id="models-columns" class="catalog-columns"><span data-i18n="modelID">Model ID</span><span data-i18n="modelDisplayName">Display name</span></div>
    <div id="models-list" class="model-catalog" role="list"></div>
    <button id="models-add" class="secondary" data-i18n="addModel">Add model</button>
    <details id="catalog-mappings" hidden><summary data-i18n="claudeMapping">Claude model mapping</summary><p class="help" data-i18n="claudeMappingHelp"></p><div id="catalog-family-fields" class="family-mappings"></div><datalist id="catalog-model-options"></datalist></details>
    <p id="models-empty" class="help" hidden></p><p id="models-notice" class="help"></p>
    <div class="actions"><button id="models-cancel" class="secondary" data-i18n="cancel">Cancel</button><button id="models-save" data-i18n="saveChanges">Save changes</button></div>
  </dialog>
  <dialog id="update-dialog" aria-labelledby="update-title">
    <div class="update-top"><span class="eyebrow" id="update-current"></span><button id="close-update" class="icon-button" data-i18n-aria="close"><svg aria-hidden="true"><use href="assets/ui.svg#close"/></svg></button></div>
    <div class="update-hero"><span id="update-emblem" class="update-emblem"><svg aria-hidden="true"><use id="update-symbol" href="assets/ui.svg#refresh"/></svg></span><div><h2 id="update-title"></h2><p id="update-status" class="help" role="status" aria-live="polite"></p></div></div>
    <div id="update-metadata" class="update-metadata" hidden></div>
    <section id="update-changes" hidden><h3 data-i18n="whatsNew">What’s new</h3><div id="update-notes" class="release-notes"></div></section>
    <div id="update-transfer" hidden><progress id="update-progress" max="100"></progress><span id="update-bytes" class="help"></span></div>
    <p id="update-error" class="notice error" role="alert" hidden></p>
    <div class="update-bottom"><p id="update-warning" class="help" data-i18n="updateRestartWarning" hidden></p><div class="actions"><button id="update-retry" class="secondary" data-i18n="checkAgain">Check again</button><button id="update-action"></button></div></div>
  </dialog>
  <dialog id="reset-dialog" aria-labelledby="reset-title">
    <div class="section-heading"><h2 id="reset-title"></h2><button id="close-reset" class="icon-button" data-i18n-aria="close"><svg aria-hidden="true"><use href="assets/ui.svg#close"/></svg></button></div>
    <p id="reset-status" class="help" role="status" aria-live="polite"></p>
    <div id="reset-card-list" role="radiogroup" data-i18n-aria="resetChoose"></div>
    <p id="reset-card-help" class="help"></p>
    <p id="reset-result" class="notice" role="status" hidden></p>
    <p id="reset-error" class="notice error" role="alert" hidden></p>
    <div class="actions"><button id="reset-reload" class="secondary" data-i18n="resetReload">Refresh cards</button><button id="reset-confirm" data-i18n="resetConfirm" disabled>Use selected reset card</button></div>
  </dialog>
  <script type="module" src="renderer.js"></script>
</body>
</html>
